CONFIG_EASNFW_IMAGE_TYPE_HIL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_REBOOT=y

# Route application logs through the shell's UART backend. The independent
# UART log backend writes to the same UART0 and can interleave with shell TX.
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y

# The default 1 KiB deferred log buffer overflows during bursts (e.g. SD
# initialization) and drops messages, including TCSTATUS lines.
CONFIG_LOG_BUFFER_SIZE=8192
