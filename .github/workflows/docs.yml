name: Build and deploy documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25" # Latest LTS

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      
      - name: Download PlantUML
        run: |
          curl -fL -o ${{ runner.temp }}/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.7/plantuml-asl-1.2026.7.jar

      - name: Build Sphinx documentation
        env:
          PLANTUML_JAR: ${{ runner.temp }}/plantuml.jar
        run: |
          make -C docs/sphinx html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/sphinx/build/html

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
